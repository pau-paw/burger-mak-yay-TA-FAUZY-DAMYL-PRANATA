  <text x="200" y="445" class="footer-text">SATU QRIS UNTUK SEMUA PEMBAYARAN</text>
  <text x="200" y="462" class="inst">BCA Mobile · Livin' · BRImo · GoPay · OVO · DANA · ShopeePay</text>

  <!-- Bottom Brand Footer Strip -->
  <rect x="12" y="476" width="376" height="32" rx="0" fill="#f8fafc" />
  <path d="M 12 476 L 388 476" stroke="#f1f5f9" stroke-width="1.5" />
  <text x="200" y="496" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10" fill="#94a3b8" text-anchor="middle">DICETAK OTOMATIS OLEH SISTEM BURGER MAK YAY</text>
</svg>
