    <rect x="154" y="187" width="8" height="8" />
    <rect x="170" y="187" width="8" height="8" />
    <rect x="186" y="187" width="8" height="8" />
    <rect x="202" y="187" width="8" height="8" />
    <rect x="218" y="187" width="8" height="8" />
    <rect x="234" y="187" width="8" height="8" />

    <rect x="102" y="239" width="8" height="8" />
    <rect x="102" y="255" width="8" height="8" />
    <rect x="102" y="271" width="8" height="8" />
    <rect x="102" y="287" width="8" height="8" />
    <rect x="102" y="303" width="8" height="8" />
    <rect x="102" y="319" width="8" height="8" />

    <!-- Center Pattern & Modules -->
    <rect x="160" y="210" width="16" height="16" rx="2" />
    <rect x="190" y="210" width="8" height="24" rx="2" />
    <rect x="210" y="218" width="24" height="8" rx="2" />
    <rect x="240" y="238" width="12" height="24" rx="2" />
    <rect x="156" y="240" width="24" height="12" rx="2" />
    <rect x="188" y="248" width="20" height="20" rx="4" />
    <rect x="216" y="254" width="16" height="16" rx="2" />
    <rect x="130" y="250" width="12" height="12" rx="2" />
    <rect x="130" y="270" width="20" height="8" rx="2" />
    <rect x="160" y="272" width="16" height="16" rx="2" />
    <rect x="184" y="280" width="28" height="10" rx="2" />
    <rect x="220" y="280" width="16" height="24" rx="2" />
    <rect x="244" y="270" width="12" height="12" rx="2" />
    <rect x="260" y="250" width="16" height="16" rx="2" />
    <rect x="282" y="240" width="14" height="20" rx="2" />

    <!-- Lower Data Matrix Modules -->
    <rect x="154" y="304" width="20" height="14" rx="2" />
    <rect x="184" y="300" width="12" height="20" rx="2" />
    <rect x="204" y="310" width="24" height="12" rx="2" />
    <rect x="236" y="310" width="14" height="18" rx="2" />
    <rect x="154" y="328" width="12" height="24" rx="2" />
    <rect x="174" y="330" width="20" height="12" rx="2" />
    <rect x="200" y="332" width="14" height="24" rx="2" />
    <rect x="222" y="338" width="20" height="12" rx="2" />
    <rect x="248" y="336" width="10" height="24" rx="2" />
    <rect x="154" y="360" width="24" height="16" rx="2" />
    <rect x="186" y="356" width="16" height="24" rx="2" />
    <rect x="210" y="368" width="28" height="12" rx="2" />
    <rect x="246" y="368" width="12" height="16" rx="2" />
  </g>

  <!-- Center QR Mini Brand Icon -->
  <rect x="182" y="267" width="36" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <rect x="186" y="271" width="28" height="28" rx="6" fill="#c2410c" />
  <text x="200" y="289" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle">MY</text>

