<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { fill: none; stroke: #e2e8f0; stroke-width: 2; rx: 16; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 19px; fill: #0f172a; text-anchor: middle; letter-spacing: 0.5px; }
      .sub { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #64748b; text-anchor: middle; letter-spacing: 1px; }
      .qris-tag { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 13px; fill: #c2410c; }
      .footer-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11px; fill: #475569; text-anchor: middle; }
      .inst { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 10px; fill: #94a3b8; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="12" y="12" width="376" height="496" rx="20" fill="#ffffff" filter="url(#shadow)" stroke="#e2e8f0" stroke-width="2" />

  <!-- Top Banner / QRIS Header -->
  <rect x="12" y="12" width="376" height="68" rx="20" fill="#f8fafc" />
  <rect x="12" y="60" width="376" height="20" fill="#f8fafc" />
  <line x1="12" y1="80" x2="388" y2="80" stroke="#f1f5f9" stroke-width="2" />

  <!-- QRIS Brand Logo Simulation -->
  <g transform="translate(145, 26)">
    <!-- Red Chevron -->
    <path d="M 0 6 L 14 0 L 28 6 L 14 30 Z" fill="#dc2626" />
    <text x="36" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#0f172a" letter-spacing="-1px">QRIS</text>
  </g>

  <!-- Merchant Info -->
  <text x="200" y="110" class="title">BURGER MAK YAY</text>
  <text x="200" y="128" class="sub">NMID : ID1020260923001 · KEDAI MAK YAY</text>

  <!-- QR Code Frame -->
  <rect x="60" y="145" width="280" height="280" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />
  <rect x="74" y="159" width="252" height="252" rx="10" fill="#ffffff" />

  <!-- Top Left Finder Pattern -->
  <g transform="translate(90, 175)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="#0f172a" />
    <rect x="8" y="8" width="40" height="40" rx="4" fill="#ffffff" />
    <rect x="16" y="16" width="24" height="24" rx="2" fill="#0f172a" />
  </g>

  <!-- Top Right Finder Pattern -->
  <g transform="translate(254, 175)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="#0f172a" />
    <rect x="8" y="8" width="40" height="40" rx="4" fill="#ffffff" />
    <rect x="16" y="16" width="24" height="24" rx="2" fill="#0f172a" />
  </g>

  <!-- Bottom Left Finder Pattern -->
  <g transform="translate(90, 339)">
    <rect x="0" y="0" width="56" height="56" rx="8" fill="#0f172a" />
    <rect x="8" y="8" width="40" height="40" rx="4" fill="#ffffff" />
    <rect x="16" y="16" width="24" height="24" rx="2" fill="#0f172a" />
  </g>

